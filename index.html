<!DOCTYPE html>
<html lang="ja">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介カード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-300 py-8">
    <header class="hidden md:block fixed top-0 left-0 w-full border-b z-50 bg-white shadow-md">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center flex-col md:flex-row gap-4">
        <div class="relative inline-flex items-end w-1/3">
    <span class="absolute top-0 left-0 text-sm text-orange-400 leading-none">
    名感性
    </span>
    <span class="text-4xl font-bold mt-3 text-red-400">
    アサヒ
    </span>
</div>
        <div class="w-1/3 text-center">
        <h2 class="text-3xl font-bold mb-4 text-center text-red-600">日本の誇る</h2>
    <h1 class="text-2xl font-bold text-gray-900 text-center">三名の超人を紹介</h1>
        </div>
        </div>  
    </header>
    <main class="md:mt-32 max-w-6xl mx-auto px-4">
    <div class="flex justify-between items-center flex-col md:flex-row gap-8">

        <div class="bg-blue-300 rounded-lg shadow p-6 flex flex-col items-center">
        <span class="text-5xl">🦹‍♂️</span>
        <p class="text-gray-600 text-sm mt-2 text-center">kaitou seikai</p>
        <h2 class="text-lg font-bold text-gray-900">回答 グット</h2>
        <p class="text-gray-600 text-sm mt-2 text-center">テストは全問正解が当たり前。白い眼鏡が特徴的な優等生、世界にとどろくその名はグット！</p>
        </div>

        <div class="bg-blue-400 rounded-lg shadow p-6 flex flex-col items-center">
        <span class="text-5xl">🕵️‍♂️</span>
        <p class="text-gray-600 text-sm mt-2 text-center">kudou sinjitu</p>
        <h2 class="text-lg font-bold text-gray-900">工藤 真実</h2>
        <p class="text-gray-600 text-sm mt-2 text-center">北の高校生占い師。人々の人生の真実を占うことで多くの事件を解決している。</p>
        </div>

        <div class="bg-purple-200 rounded-lg shadow p-6 flex flex-col items-center">
        <span class="text-5xl">🧘‍♂️</span>
        <p class="text-gray-600 text-sm mt-2 text-center">kyogoku makoto</p>
        <h2 class="text-lg font-bold text-gray-900">京極 真実</h2>
        <p class="text-gray-600 text-sm mt-2 text-center">フィギュアスケートと将棋の二種で世界一を達成。噓のようであるこの二冠はマコトである。</p>
        </div>

        </div>
    </main>
    <footer class="mt-8 text-center text-gray-500">
        <div class="flex gap-2 flex-col md:flex-row">
            <div class="flex-1">
        <p>&copy; 2026 三名の紹介</p>
            </div>
            <div class="flex-1">
                <p>既存のコンテンツとは一切関係のないフィクションです。</p>
            </div>
        </div>
    </footer>
    </body>
</html>
